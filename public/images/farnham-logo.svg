<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" role="img" aria-label="Farnham Senior Health Advisors">
  <!-- Mark: navy rounded tile with a geometric gold F (no font dependency) -->
  <rect x="8" y="12" width="48" height="48" rx="11" fill="#1E3A5F"/>
  <!-- gold F -->
  <rect x="23" y="24" width="6" height="26" rx="1.5" fill="#C8A44E"/>
  <rect x="23" y="24" width="18" height="6" rx="1.5" fill="#C8A44E"/>
  <rect x="23" y="34" width="13" height="5.5" rx="1.5" fill="#C8A44E"/>
  <!-- Wordmark (fallback fonts so it renders standalone) -->
  <text x="70" y="40" font-family="'DM Serif Display', Georgia, 'Times New Roman', serif" font-size="30" fill="#1E3A5F">Farnham<tspan fill="#C8A44E">.</tspan></text>
  <text x="72" y="57" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="2.4" fill="#5B7290" font-weight="600">SENIOR HEALTH ADVISORS</text>
</svg>
